# Per-epoch WER/CER check against the dev/val manifest, on CPU so it never
# competes with the live training run for GPU memory. Points at last.pt (the
# most recent epoch's weights) rather than best.pt, since WER/CER and val
# loss don't always move together - see project memory for why. Kept in the
# repo (not a scratch/tmp file) so it survives session restarts.
manifests:
  output_dir: /home/user/shaun/zipformer-training-pipeline/zipformer_bn_rtx5080
  tokenizer_vocab_size: 1024
  tokenizer_model_type: bpe

model:
  d_model: 256
  n_layers: 12
  n_heads: 4
  attn_head_dim: 24
  nla_hidden_dim: 192
  conv_kernel_size: 9
  ff_expansion_factor: 4
  dropout: 0.1
  bypass_min_scale: 0.4

eval:
  model_path: /home/user/shaun/zipformer-training-pipeline/zipformer_bn_rtx5080/last.pt
  manifest: /home/user/shaun/conformer-training-pipeline/data/dev_manifest.json
  batch_size: 16
  num_workers: 4
  device: cpu
  out: null

# RNNT at the same encoder size as config.rtx5080.yaml's CTC run, warm-started
# from that run's final checkpoint (epoch 25, step 2.495M, dev WER 28.31% /
# CER 11.69% with greedy CTC). Same manifests, CWD rules and model section.
#
# Differences from config.rtx5080.yaml:
#   - loss: rnnt, init_from the CTC checkpoint: the encoder (and CTC head)
#     load from it, the prediction + joint networks (~2M params) start fresh,
#     and the optimizer / LR schedule restart from step 0.
#   - separate output_dir, so the CTC checkpoints are never overwritten. It
#     holds a copy of the CTC run's tokenizer.model - train.py trains a new
#     tokenizer when output_dir has none, and the ids must match.
#   - length-budgeted batching instead of a fixed batch size. RNNT's joint
#     tensor is batch x frames x tokens x vocab; a fixed batch of the longest
#     clips (up to 40.6s / 283 tokens) OOMs even at batch 4. Budgets were
#     measured on this GPU: peak ~= 0.7 GB + 9.3 KB per joint cell + 12.5 MB
#     per padded second, so these two caps bound peak at ~4.4 GB - about what
#     the CTC run used, leaving room for the other processes on this GPU.

manifests:
  train_manifest: /home/user/shaun/conformer-training-pipeline/data/train_manifest.json
  val_manifest: /home/user/shaun/conformer-training-pipeline/data/dev_manifest.json
  output_dir: /home/user/shaun/zipformer-training-pipeline/zipformer_bn_rtx5080_rnnt
  tokenizer_vocab_size: 1024
  tokenizer_model_type: bpe

model:
  d_model: 256
  n_layers: 12
  n_heads: 4
  attn_head_dim: 24
  nla_hidden_dim: 192
  conv_kernel_size: 9
  ff_expansion_factor: 4
  dropout: 0.1
  bypass_min_scale: 0.4

train:
  loss: rnnt
  epochs: 30
  # Upper bound on utterances per batch; the budgets below do the real sizing.
  batch_size: 64
  max_batch_seconds: 150
  max_joint_cells: 200000
  # More audio per step than the CTC run's batch of 8, so more decode workers.
  num_workers: 8
  # Below the CTC run's 3e-4 peak: the encoder is already trained, and a full
  # re-warm to 3e-4 would shake it while the fresh heads are still random.
  lr: 1.0e-4
  # The fresh prediction/joint networks train at lr x 10. In a 375-step smoke
  # test on 3k clips, one shared 1e-4 left val loss stuck at 6.42/token with
  # all-blank output; x10 reached 2.15 with mostly-correct transcripts.
  head_lr_mult: 10
  weight_decay: 1.0e-3
  warmup_steps: 1000
  grad_clip: 5.0
  save_interval_steps: 1000
  log_interval: 50
  transcribe_interval: 500
  # 2026-09-28: the original run stalled during epoch 27 (step ~891,975 -
  # tqdm's own elapsed-time counter froze and nvidia-smi read 0% GPU util for
  # 5 straight 1s samples, for over an hour; not an OOM, no allocator warning
  # was ever printed). GPU had dropped to 567MB free at the time, squeezed by
  # another process on this shared box (this box's other jobs vary in size
  # over time - see project memory). Killing it freed the GPU back to
  # 6.6GB free immediately, so this looks like the caching allocator stuck
  # in a slow retry/defragment cycle under memory pressure rather than a bug
  # in this code. resume_from (not init_from - this is the same run/loss,
  # not a switch) picks up the optimizer/scheduler state exactly, but only at
  # epoch granularity (start_epoch = ckpt["epoch"] + 1): last.pt's epoch=27
  # means training resumes at the start of epoch 28, skipping the last ~16%
  # of epoch 27's data and its validation/WER check - acceptable, not worth
  # re-deriving a step-level resume for one skipped partial epoch.
  init_from: null
  resume_from: /home/user/shaun/zipformer-training-pipeline/zipformer_bn_rtx5080_rnnt/last.pt
  device: cuda
  precision: bf16

wandb:
  wandb_enabled: true
  wandb_api_key: null # uses ~/.netrc (already logged in)
  wandb_project: zipformer-training-pipeline
  wandb_entity: null
  wandb_run_name: rtx5080-tiny-rnnt-resumed

eval:
  model_path: null
  manifest: /home/user/shaun/conformer-training-pipeline/data/test_manifest.json
  batch_size: 16
  num_workers: 4
  device: cuda
  out: null

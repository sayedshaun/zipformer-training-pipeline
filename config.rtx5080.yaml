# Local config: single RTX 5080 (16GB), reusing the already-prepared corpus
# from the sibling conformer-training-pipeline repo instead of re-downloading
# or re-transcoding anything.
#
# Differences from config.yaml:
#   - manifests/eval paths point at conformer-training-pipeline/data's
#     manifests directly (absolute paths - see src/config.py's note on why
#     that's the convention for a path into a sibling repo). Those manifests'
#     audio_filepath entries are relative to that repo's root, so train.py
#     must be launched with that directory as the CWD.
#   - the GPU is shared with other processes on this box (~7GB free out of
#     16GB at the time this was written), so this uses the smaller/tiny
#     model size and a conservative batch size rather than config.yaml's
#     full-size defaults, to stay clear of OOM.
#   - precision is bf16: RTX 5080 is Blackwell (sm_120) and has full bf16
#     support, unlike the T4s the previous config targeted.

manifests:
  train_manifest: /home/user/shaun/conformer-training-pipeline/data/train_manifest.json
  val_manifest: /home/user/shaun/conformer-training-pipeline/data/dev_manifest.json
  output_dir: /home/user/shaun/zipformer-training-pipeline/zipformer_bn_rtx5080
  tokenizer_vocab_size: 1024
  tokenizer_model_type: bpe

# Tiny: ~20M params - sized to fit comfortably in the ~7GB currently free on
# this shared GPU. Bump to config.yaml's full size once the GPU is free.
model:
  d_model: 256
  n_layers: 12
  n_heads: 4
  attn_head_dim: 24
  nla_hidden_dim: 192
  conv_kernel_size: 9
  ff_expansion_factor: 4
  dropout: 0.1
  bypass_min_scale: 0.4

train:
  loss: ctc
  # Extended from the original 20 (finished 2026-09-23, best_val_loss 0.8705
  # at epoch 16) after WER kept improving past epoch 13 even though val_loss
  # had plateaued - see project memory. resume_from picks up at
  # ckpt["epoch"]+1, so this runs 80 more epochs (20..99), not 100 more.
  epochs: 100
  batch_size: 8
  num_workers: 6
  lr: 3.0e-4
  weight_decay: 1.0e-3
  warmup_steps: 1000
  grad_clip: 5.0
  save_interval_steps: 1000
  log_interval: 50
  transcribe_interval: 500
  resume_from: /home/user/shaun/zipformer-training-pipeline/zipformer_bn_rtx5080/last.pt
  device: cuda
  precision: bf16

wandb:
  wandb_enabled: true
  wandb_api_key: null # uses ~/.netrc (already logged in)
  wandb_project: zipformer-training-pipeline
  wandb_entity: null
  wandb_run_name: rtx5080-tiny-ctc-ext

eval:
  model_path: null
  manifest: /home/user/shaun/conformer-training-pipeline/data/test_manifest.json
  batch_size: 16
  num_workers: 4
  device: cuda
  out: null

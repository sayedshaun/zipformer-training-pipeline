# Per-epoch WER/CER check for the RNNT run (config.rtx5080.rnnt.yaml) - same
# as config.eval_dev_cpu.yaml but reading that run's output_dir. eval.py sees
# the RNNT weights in the checkpoint and decodes with greedy RNNT.
manifests:
  output_dir: /home/user/shaun/zipformer-training-pipeline/zipformer_bn_rtx5080_rnnt
  tokenizer_vocab_size: 1024
  tokenizer_model_type: bpe

model:
  d_model: 256
  n_layers: 12
  n_heads: 4
  attn_head_dim: 24
  nla_hidden_dim: 192
  conv_kernel_size: 9
  ff_expansion_factor: 4
  dropout: 0.1
  bypass_min_scale: 0.4

eval:
  model_path: /home/user/shaun/zipformer-training-pipeline/zipformer_bn_rtx5080_rnnt/last.pt
  manifest: /home/user/shaun/conformer-training-pipeline/data/dev_manifest.json
  batch_size: 16
  num_workers: 4
  device: cpu
  out: null
